sources:
  - name: "qalight_baza"
    url: "https://qalight.ua/baza-znan/"
    # CSS-селектор, який вказує, де саме лежать посилання на статті
    link_selector: "ul.innermenu li ul.sub-menu li ul.sub-menu li a"
    # CSS-селектор для тексту самої статті (виключає помилки trafilatura)
    content_selector: "div.single-knowledge-base-content"
    # Селектори для витягування назви категорії з батьківських елементів
    category_container: "li.menu-item-has-children"
    category_name_tag: "a"
    
